name: Live Admission

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Execute live admission
        run: |
          mkdir -p results
          python scripts/run_live_admission.py --output results/live-admission.json
      - name: Upload admission report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-admission-report
          path: results/live-admission.json
          if-no-files-found: error
