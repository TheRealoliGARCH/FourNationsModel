[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "four-nations-model"
version = "0.1.0"
description = "Computational implementation of the Four Nations monetary-political-economic equilibrium theory"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "pandas>=2.2",
  "mpmath>=1.3",
  "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
parallel = ["ray>=2.30", "dask[distributed]>=2024.5"]

[tool.setuptools.packages.find]
include = ["fournations*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
